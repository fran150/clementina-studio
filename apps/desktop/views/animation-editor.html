<section id="animationEditor" class="studioEditor" hidden>
  <aside class="anLibrary studioDock studioDockLeft">
    <h2>Animations</h2>
    <div id="anAnimActions" class="assetToolbar"></div>
    <div id="anAnimList" role="listbox" aria-label="Animations"></div>
    <p>Double-click an animation to rename it.</p>
  </aside>
  <aside class="anShapeLibrary studioDock studioDockLeft">
    <h2>Shapes</h2>
    <div
      id="anShapeList"
      role="listbox"
      aria-multiselectable="true"
      aria-label="Shapes to append"
    ></div>
    <p id="anShapeNote"></p>
    <button id="anAppend">Append selected frames</button>
    <p>Ctrl/Cmd-click to select shapes; Shift-click for a range. They append in library order.</p>
  </aside>
  <main class="studioMain">
    <div class="anTop">
      <div class="studioBarStart"><strong id="anGroupTitle"></strong></div>
      <div class="studioBarEnd"></div>
    </div>
    <div id="anEmpty" class="studioEmpty" role="status">
      <p id="anEmptyMessage"></p>
      <div class="studioEmptyActions">
        <button id="anEmptyNew">New animation</button
        ><button id="anCreateShape">Go to Shapes</button>
      </div>
    </div>
    <div id="anBody" class="studioStage">
      <div id="anPreviewCol">
        <canvas
          id="anCanvas"
          class="studioArt"
          width="320"
          height="200"
          aria-label="Animation preview at native 320 by 200 resolution"
          title="Drag the pose to adjust this frame’s offset"
        ></canvas>
      </div>
    </div>
    <div id="anTransport">
      <button id="anPrevious"></button><button id="anPlay" aria-pressed="false"></button
      ><button id="anNext"></button><span id="anFrameCounter"></span>
    </div>
    <div id="anTimeline" role="listbox" aria-label="Animation frames"></div>
    <div id="anStatus"></div>
  </main>
  <aside class="anFramePanel studioDock studioDockRight">
    <h2>Frame</h2>
    <div id="anFrames"></div>
    <p>
      Drag the pose on the preview to change the frame's offset. Flips mirror the shape about its
      origin.
    </p>
    <button id="anDuplicateFrame"></button><button id="anMoveEarlier"></button
    ><button id="anMoveLater"></button>
  </aside>
</section>
