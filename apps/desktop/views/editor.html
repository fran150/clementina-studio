<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clementina Studio</title>
    <!-- Shared styles first, then one sheet per script, in the order the scripts
     load: a later sheet overrides an earlier one. -->
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/studio-shell.css" />
    <link rel="stylesheet" href="styles/image-import-ui.css" />
    <link rel="stylesheet" href="styles/bank-editor.css" />
    <link rel="stylesheet" href="styles/overlay-editor.css" />
    <link rel="stylesheet" href="styles/background-editor.css" />
    <link rel="stylesheet" href="styles/palette-library.css" />
    <link rel="stylesheet" href="styles/animation-editor.css" />
    <link rel="stylesheet" href="styles/sprite-composer.css" />
    <link rel="stylesheet" href="styles/audio-shared.css" />
    <link rel="stylesheet" href="styles/sound-editor.css" />
    <link rel="stylesheet" href="styles/music-editor.css" />
    <link rel="stylesheet" href="styles/builder-editor.css" />
  </head>
  <body>
    <aside id="workflowNav">
      <div class="brand">CLEMENTINA STUDIO</div>
      <div class="navGroup">GRAPHICS</div>
      <button data-view="palettes" title="Palettes (Ctrl/Cmd+1)">Palettes</button
      ><button data-view="tiles" title="Tilesets (Ctrl/Cmd+2)">Tilesets</button
      ><button data-view="shapes" title="Shapes (Ctrl/Cmd+3)">Shapes</button
      ><button data-view="animations" title="Animations (Ctrl/Cmd+4)">Animations</button
      ><button data-view="backgrounds" title="Backgrounds (Ctrl/Cmd+5)">Backgrounds</button
      ><button data-view="overlays" title="Overlays (Ctrl/Cmd+6)">Overlays</button>
      <div class="navGroup navRule">AUDIO</div>
      <button data-view="sounds" title="Sounds (Ctrl/Cmd+7)">Sounds</button
      ><button data-view="music" title="Music (Ctrl/Cmd+8)">Music</button>
      <div class="navGroup navRule">BUILD</div>
      <button data-view="builder" title="Builder (Ctrl/Cmd+9)">Builder</button>
    </aside>
    <div id="workspace">
      <header>
        <h1>Clementina Studio <small>· 8×8 tiles · 1/3 bpp · 16 palette banks</small></h1>
        <label class="lbl"
          >Name <input type="text" id="nameInput" value="tiles" title="Base filename for Save"
        /></label>
        <button id="nativeOpen">Open project…</button><button id="nativeSave">Save project</button
        ><button id="nativeSaveAs">Save as…</button><button id="newBtn">New</button>
        <div class="sep"></div>
        <label class="lbl" id="configPickerWrap"
          >Config
          <select
            id="configPicker"
            aria-label="Bank config every editor previews with"
            title="Which config every editor previews with. Preview only — it does not change what a project exports."
          ></select>
        </label>
        <div class="spacer"></div>
      </header>

      <!-- include builder-editor.html -->
      <!-- include music-editor.html -->
      <!-- include sound-editor.html -->
      <!-- include sprite-composer.html -->
      <!-- include animation-editor.html -->
      <!-- include palette-library.html -->
      <!-- include background-editor.html -->
      <!-- include overlay-editor.html -->
      <!-- include bank-editor.html -->
      <footer>
        <span id="status">Ready.</span><span id="viewStatus"></span><span id="dirty"></span>
      </footer>
    </div>
    <!-- include image-import-dialog.html -->
    <!-- include palette-delete-dialog.html -->
    <!-- An import map has to come before the first module. -->
    <script type="importmap">
      {
        "imports": {
          "@clementina/assets/audio": "../../node_modules/@clementina/assets/dist/audio.js"
        }
      }
    </script>
    <script type="module" src="app.js"></script>
    <!-- The MIA audio engine and song compiler, built from packages/assets/audio.ts.
     It runs after the studio has loaded, before the page finishes loading. -->
    <script type="module">
      import * as MiaAudio from '../../dist/packages/assets/audio.js';
      window.MiaAudio = MiaAudio;
      document.dispatchEvent(new Event('miaaudioready'));
    </script>
  </body>
</html>
