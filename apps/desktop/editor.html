<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clementina Studio</title>
<style>
  :root {
    --bg: #14110d; --panel: #1e1a14; --panel2: #262017; --line: #3a3022;
    --ink: #ffb000; --text: #d8cfae; --text-dim: #8a8268; --sel: #36c9d6; --grid: #2c2418;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: "SF Mono","JetBrains Mono",Menlo,Consolas,monospace; font-size: 13px; }
  header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 14px; margin: 0; color: var(--ink); letter-spacing: .5px; font-weight: 600; }
  header h1 small { color: var(--text-dim); font-weight: 400; }
  .spacer { flex: 1; }
  .sep { width: 1px; height: 22px; background: var(--line); }
  button, select, label.btn { font-family: inherit; font-size: 12px; background: var(--panel2);
    color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 5px 9px; cursor: pointer; }
  button:hover, label.btn:hover { background: #322a1d; border-color: #4d4129; }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .4; cursor: default; }
  button.on { background: var(--ink); color: #1a1206; border-color: var(--ink); font-weight: 700; }
  select { padding: 4px 6px; }
  input[type=file] { display: none; }
  label.lbl { color: var(--text-dim); display: inline-flex; align-items: center; gap: 5px; }

  main { display: flex; gap: 16px; padding: 14px; align-items: flex-start; flex-wrap: wrap; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px; }
  .panel h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim);
    margin: 0 0 10px; font-weight: 600; }

  #ovWrap { max-height: 80vh; overflow: auto; }
  #overview { image-rendering: pixelated; display: block; cursor: pointer; background: #000; }

  .editorCol { display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
  #editor { image-rendering: pixelated; cursor: crosshair; touch-action: none; background: #000; border-radius: 4px; }
  .toolbtns { display: grid; grid-template-columns: repeat(4, auto); gap: 6px; margin-top: 10px; }
  .toolbtns button { padding: 5px 0; }

  .previews { display: flex; gap: 16px; align-items: flex-end; }
  .preview { text-align: center; }
  .preview canvas { image-rendering: pixelated; background: #000; border: 1px solid var(--line); display: block; }
  .preview span { color: var(--text-dim); font-size: 10px; display: block; margin-top: 4px; }

  .palBankRow { display: flex; align-items: center; gap: 3px; padding: 2px 3px; border: 1px solid transparent; border-radius: 4px; }
  .palBankRow.active { border-color: var(--sel); background: #0e1517; }
  .palBankName { width: 28px; color: var(--text-dim); font-size: 10px; }
  .sw { width: 22px; height: 22px; border-radius: 3px; border: 2px solid var(--line); cursor: pointer; position: relative; }
  .sw.sel { border-color: var(--sel); box-shadow: 0 0 0 1px var(--sel); }
  .palrow { display: flex; gap: 10px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
  input[type=color] { width: 40px; height: 28px; padding: 0; border: 1px solid var(--line); border-radius: 4px; background: none; }
  input[type=text] { font-family: inherit; font-size: 12px; background: #000; color: var(--text);
    border: 1px solid var(--line); border-radius: 4px; padding: 5px 7px; width: 120px; }
  input[type=text]:focus { outline: none; border-color: var(--ink); }

  .planes { display: flex; gap: 10px; }
  .planes canvas { image-rendering: pixelated; background: #000; border: 1px solid var(--line); }

  .info { line-height: 1.7; }
  .info b { color: var(--ink); }
  .info .bytes { color: var(--text-dim); }
  .hint { color: var(--text-dim); font-size: 11px; line-height: 1.6; }

  footer { position: sticky; bottom: 0; background: var(--panel); border-top: 1px solid var(--line);
    padding: 6px 14px; color: var(--text-dim); font-size: 11px; display: flex; gap: 18px; }
  footer .dirty { color: var(--ink); }

  .overlay { position: fixed; inset: 0; background: #000a; display: none; align-items: center; justify-content: center; z-index: 50; }
  .overlay.show { display: flex; }
  .modal { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 20px; width: 460px; }
  .modal h3 { margin: 0 0 14px; color: var(--ink); font-size: 14px; }
  .modal .field { display: flex; justify-content: space-between; align-items: center; margin: 9px 0; }
  .modal .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  .modal .note { color: var(--text-dim); font-size: 11px; line-height: 1.6; margin-top: 6px; }

  .dropdown { position: relative; display: inline-block; }
  .dropdown-menu { display: none; position: absolute; top: 100%; left: 0; background: var(--panel2);
    border: 1px solid var(--line); border-radius: 4px; z-index: 20; min-width: 200px; }
  .dropdown.open .dropdown-menu { display: block; }
  .dropdown-menu button { display: block; width: 100%; text-align: left; border: 0; border-radius: 0; }
[hidden] { display:none !important; }
body { padding-left:210px; }
#workflowNav { position:fixed;inset:0 auto 0 0;width:210px;background:#181510;border-right:1px solid var(--line);padding:26px 16px; }
.brand { color:var(--ink);font-size:17px;font-weight:bold;letter-spacing:2px; }.brand span {display:block;font-size:11px;margin-top:5px;color:var(--text-dim);}
.navGroup {font-size:10px;letter-spacing:2px;color:var(--text-dim);margin:32px 10px 10px;}
#workflowNav button {display:block;width:100%;text-align:left;margin:5px 0;padding:12px;}
.navNote {color:var(--text-dim);line-height:1.6;margin:28px 10px;font-size:11px;}
#workflowHeading {padding:24px 26px 12px;}#workflowHeading h1 {font-size:24px;margin:0 0 8px;}#viewHelp {color:var(--text-dim);margin:0;}
header h1, header .sep, header .lbl, header #bankSel, header #mode1, header #mode3,header #planeWrap,header #undoBtn,header #redoBtn {display:none;}
#tilesEditor {max-width:100%;}#ovWrap {max-height:56vh;}footer {left:210px;}
</style>
<link rel="stylesheet" href="studio-shell.css">
</head>
<body>
<aside id="workflowNav"><div class="brand">CLEMENTINA STUDIO</div><div class="navGroup">GRAPHICS</div>
<button data-view="palettes">Palettes</button><button data-view="tiles">Tilesets</button><button data-view="shapes">Shapes</button><button data-view="animations">Animations</button>
<div class="navNote">Define palettes and bank configs, draw tilesets, build shapes from their tiles, then sequence shapes into animations.</div></aside>
<div id="workspace"><div id="workflowHeading"><h1 id="viewTitle">Tilesets</h1><p id="viewHelp"></p></div>
<header>
  <h1>Clementina Studio <small>· 8×8 tiles · 1/3 bpp · 16 palette banks</small></h1>
  <label class="lbl">Name <input type="text" id="nameInput" value="tiles" title="Base filename for Save"></label>
  <button id="nativeOpen">Open project…</button><button id="nativeSave">Save project</button><button id="nativeSaveAs">Save as…</button><button id="newBtn">New</button>
  <div class="sep"></div>
  <label class="lbl" id="configPickerWrap">Palette banks
    <select id="configPicker" aria-label="Active palette bank config" title="Which config every editor previews with. Preview only — it does not change what a project exports."></select>
  </label>
  <div class="spacer"></div>
</header>

<div id="spritePanel" hidden></div>
<footer><span id="status">Ready.</span><span id="dirty"></span></footer>
</div>
<script>
"use strict";
// ===== Model =====
// A tileset is one CHR bank's worth of graphics: 3 planes * 2048 B, each plane
// 256 tiles * 8 rows. 3bpp color index = p0|p1<<1|p2<<2; a 1bpp tileset holds
// three independent mono pages, one per plane. Bit 0 is leftmost.
// Palette RAM is 16 banks of 8 RGB565 colors, shared by every layer. A config
// names the palette in each bank; the active one is a preview choice only.
// See docs/model.md.
const GH = 8, TILES = 256, PLANE = TILES * GH, TILESET_BYTES = 3 * PLANE; // 2048, 6144
const PAL_BANKS = 16, PAL_COLORS = 8;

const $ = id => document.getElementById(id);
const statusEl = $('status'), dirtyEl = $('dirty'), nameInput = $('nameInput');

// ===== state =====
let paletteLibrary = [], paletteConfigs = [], activeConfigId = null, tilesets = [];
let currentView = 'tiles', shapes = [], animations = [];
let shapeIndex = 0, animationIndex = 0, frameIndex = 0, shapeHistory = [], playing = false, playFrame = 0, playStart = 0;
let dirty = false;

// ===== RGB565 helpers =====
const to565 = (r, g, b) => ((r >> 3) << 11) | ((g >> 2) << 5) | (b >> 3);
function css565(v) { const r = (v>>11)&31, g = (v>>5)&63, b = v&31;
  return `rgb(${Math.round(r*255/31)},${Math.round(g*255/63)},${Math.round(b*255/31)})`; }
function css565ToInput(v) { const r = Math.round(((v>>11)&31)*255/31), g = Math.round(((v>>5)&63)*255/63), b = Math.round((v&31)*255/31);
  return '#' + [r,g,b].map(x => x.toString(16).padStart(2,'0')).join(''); }
function inputTo565(h) { return to565(parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)); }

// ===== Palettes and bank configs =====
// Nothing binds a palette to a bank except a config, so every color question
// goes through the active one. A bank holding nothing reads as black.
const BLACK_PALETTE = Object.freeze(Array(PAL_COLORS).fill(0));
function libraryPalette(id) { return paletteLibrary.find(p => p.id === id); }
function activeConfig() { return paletteConfigs.find(c => c.id === activeConfigId) ?? paletteConfigs[0]; }
/** The palette showing in a bank right now, or undefined when the bank is empty. */
function bankPalette(bank) { return libraryPalette(activeConfig()?.banks?.[bank]); }
function bankColors(bank) { return bankPalette(bank)?.colors ?? BLACK_PALETTE; }
function bankColor(bank, ink) { return bankColors(bank)[ink]; }
function setBankColor(bank, ink, value) { const p = bankPalette(bank); if (p) p.colors[ink] = value; }
/** The active config flattened to the 128 words palette RAM holds. */
function resolveActiveConfig() { const out = []; for (let b = 0; b < PAL_BANKS; b++) out.push(...bankColors(b)); return out; }

function uniquePaletteName() {
  const taken = new Set(paletteLibrary.map(p => p.name.toLowerCase()));
  let n = 1; while (taken.has(`palette ${n}`)) n++;
  return `Palette ${n}`;
}
function createPalette(colors, name) {
  const palette = { id: crypto.randomUUID(), name: name ?? uniquePaletteName(), colors: [...colors] };
  paletteLibrary.push(palette); return palette;
}
/** Reuses a palette with the same colors so configs keep sharing it. */
function internPalette(colors, name) {
  return paletteLibrary.find(p => p.colors.every((v, i) => v === colors[i])) ?? createPalette(colors, name);
}
function uniqueConfigName() {
  const taken = new Set(paletteConfigs.map(c => c.name.toLowerCase()));
  let n = 1; while (taken.has(`config ${n}`)) n++;
  return `Config ${n}`;
}
/** A new config fills its banks from the library in order so drawing can start at once. */
function createConfig(name, banks) {
  const config = { id: crypto.randomUUID(), name: name ?? uniqueConfigName(),
    banks: banks ? [...banks] : Array.from({length: PAL_BANKS}, (_, i) => paletteLibrary[i]?.id ?? null) };
  paletteConfigs.push(config); return config;
}

const BACKDROP_BLUE_565 = 0x1A1F;
// A fresh palette starts as a rainbow so its colors are distinguishable while
// drawing; color 0 keeps the backdrop, being the key rather than an ink.
const RAINBOW_565 = [
  BACKDROP_BLUE_565,
  to565(255, 0, 0), to565(255, 127, 0), to565(255, 255, 0),
  to565(0, 255, 0), to565(0, 255, 255), to565(0, 0, 255), to565(139, 0, 255),
];
// Clementina's 16 startup colors: the text ink each of palette RAM's sixteen
// banks holds by default at boot (clementina-text.palette.bin, loaded by
// video.c video_load_default_palette / video.go videoLoadDefaultPalette),
// in bank order 0-15 - white, red, orange, yellow, green, cyan, backdrop
// blue, violet, magenta, black, gray, light gray, dark red/brown, dark
// green, a brighter blue, bright white (docs/phase5-charset-keyboard.md
// SS2.4, the startup text-ink table).
const CLEMENTINA_16_565 = [
  0xFFFF, 0xF800, 0xFC60, 0xFEC0, 0x07E0, 0x075F, BACKDROP_BLUE_565, 0xA81F,
  0xFA7F, 0x0000, 0x8410, 0xC618, 0x7920, 0x03E0, 0x6AFF, 0xFFFF,
];
/** The sixteen colors above, eight to a palette, in palette banks 0 and 1. */
function loadDefaultPalettes() {
  paletteLibrary = []; paletteConfigs = [];
  createPalette(CLEMENTINA_16_565.slice(0, 8), 'Bank 0');
  createPalette(CLEMENTINA_16_565.slice(8, 16), 'Bank 1');
  activeConfigId = createConfig('Default').id;
}

// ===== Tilesets =====
function uniqueTilesetName() {
  const taken = new Set(tilesets.map(t => t.name.toLowerCase()));
  let n = 1; while (taken.has('tileset_' + n)) n++;
  return 'Tileset_' + n;
}
function createTileset(name) {
  const tileset = { id: crypto.randomUUID(), name: name ?? uniqueTilesetName(), bpp: 3,
    chr: Array(TILESET_BYTES).fill(0), tilePaletteBanks: Array(TILES).fill(0), compositions: [] };
  tilesets.push(tileset); return tileset;
}
function tilesetById(id) { return tilesets.find(t => t.id === id); }
/**
 * One pixel of a tile. A 1bpp tileset reads a single plane; `plane` is the page
 * being viewed, which belongs to the editor rather than the tileset.
 */
function tilePixel(tileset, tile, x, y, plane = 0) {
  const bit = p => (tileset.chr[p*PLANE + tile*GH + y] >> x) & 1;
  return tileset.bpp === 1 ? bit(plane) : bit(0) | (bit(1) << 1) | (bit(2) << 2);
}
function setTilePixel(tileset, tile, x, y, value, plane = 0) {
  for (const p of tileset.bpp === 1 ? [plane] : [0,1,2]) {
    const i = p*PLANE + tile*GH + y, bit = tileset.bpp === 1 ? (value ? 1 : 0) : (value >> p) & 1;
    if (bit) tileset.chr[i] |= (1<<x); else tileset.chr[i] &= ~(1<<x);
  }
}

// ===== helpers =====
function setStatus(s) { statusEl.textContent = s; }
function markDirty() { dirty = true; setDirtyLabel(); }
function setDirtyLabel() { dirtyEl.className = dirty ? 'dirty' : ''; dirtyEl.textContent = dirty ? '● unsaved changes' : ''; }
function baseName() { return (nameInput.value.trim() || 'tiles').replace(/[^\w.\-]+/g, '_'); }
function setNameFromFile(name) { nameInput.value = (name || '').replace(/\.[^/.]+$/, '') || 'tiles'; }
/** Every editor redraws on a config change, since all of them preview through it. */
function redrawAll() { renderConfigPicker(); window.renderBankEditor?.(); window.renderPaletteLibrary?.(); renderAnimations(); }

// ===== active config picker =====
// Switching config is a constant part of drawing, not a setting, so it lives in
// the header where every view can reach it.
function renderConfigPicker() {
  const picker = $('configPicker');
  picker.replaceChildren(...paletteConfigs.map(c => new Option(c.name, c.id, false, c.id === activeConfigId)));
  picker.disabled = paletteConfigs.length < 2;
  $('configPickerWrap').title = paletteConfigs.length < 2
    ? 'Add more configs in Palettes to switch between them'
    : 'Preview only — it does not change what a project exports';
}
$('configPicker').onchange = () => { activeConfigId = $('configPicker').value; redrawAll(); };

// ===== project =====
function newProject() {
  if (dirty && !confirm('Discard unsaved changes?')) return;
  window.studio?.newProject();
  tilesets = []; animations = []; shapes = []; shapeIndex = 0; animationIndex = 0; frameIndex = 0;
  shapeHistory = []; playing = false;
  loadDefaultPalettes();
  nameInput.value = 'tiles';
  dirty = false; setDirtyLabel(); redrawAll();
  setStatus('New project — create your first tileset.');
}
function studioProject() {
  return {paletteLibrary:structuredClone(paletteLibrary),paletteConfigs:structuredClone(paletteConfigs),
   activeConfigId,tilesets:structuredClone(tilesets),shapes:structuredClone(shapes),animations:structuredClone(animations)};
}
function restoreStudioProject(p,name='Recovered project') {
  paletteLibrary=structuredClone(p.paletteLibrary??[]);paletteConfigs=structuredClone(p.paletteConfigs??[]);
  activeConfigId=p.activeConfigId??paletteConfigs[0]?.id??null;tilesets=structuredClone(p.tilesets??[]);
  animations=structuredClone(p.animations??[]);shapes=structuredClone(p.shapes??[]);
  shapeIndex=0;animationIndex=0;frameIndex=0;playing=false;shapeHistory=[];
  setNameFromFile(name);dirty=false;setDirtyLabel();redrawAll();
}
async function studioAction(action) { try { await action(); } catch(e) { alert(e.message); setStatus(e.message); } }
$('newBtn').onclick = () => newProject();
$('nativeOpen').onclick=()=>studioAction(async()=>{
 if(dirty&&!confirm('Discard unsaved changes?'))return;
 const file=await window.studio.open();if(!file)return;
 restoreStudioProject(file.project,file.name);await window.studio.opened(file.path);setStatus('Opened '+file.name);
});
async function nativeSave(saveAs) { const snapshot=studioProject();const name=await window.studio.save(snapshot,saveAs);if(name){dirty=JSON.stringify(snapshot)!==JSON.stringify(studioProject());setDirtyLabel();setStatus('Saved '+name);} }
$('nativeSave').onclick=()=>studioAction(()=>nativeSave(false));
$('nativeSaveAs').onclick=()=>studioAction(()=>nativeSave(true));
if(!window.studio)for(const id of ['nativeOpen','nativeSave','nativeSaveAs'])$(id).disabled=true;

// ===== views =====
const descriptions={
 palettes:['Palettes','Palettes hold eight colors. A bank config places sixteen of them in palette RAM; a game loads one config at a time.'],
 tiles:['Tilesets','Each tileset fills one CHR bank. Draw tiles and record which palette bank each was drawn against.'],
 shapes:['Shapes','One arrangement of sprites from a single tileset. Later sprites draw on top.'],
 animations:['Animations','Sequence shapes and set their timing. Editing a shape updates every frame showing it.'],
};
function showView(view){
 StudioShell.selectView(view);
 currentView=view;playing=false;frameIndex=0;window.scrollTo(0,0);
 $('viewTitle').textContent=descriptions[view][0];$('viewHelp').textContent=descriptions[view][1];
 renderConfigPicker();renderAnimations();window.renderBankEditor?.();
}
document.querySelectorAll('[data-view]').forEach(button=>button.onclick=()=>showView(button.dataset.view));

// ===== boot =====
// The editors below attach to the shell and wrap showView, so boot after them.
window.bootStudio=()=>{newProject();showView('tiles');};
</script>
<script src="studio-shell.js"></script>
<script src="image-import-ui.js"></script><script src="bank-editor.js"></script><script src="palette-library.js"></script><script src="animation-editor.js"></script><script src="sprite-composer.js"></script>
<script>bootStudio();</script>
</body>
</html>
